<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AgentIQ - Data Science Studio</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D1117; color: #F1F5F9; margin: 0; }
        .container { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #161B22; border-right: 1px solid #1E2D3D; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #3B82F6, #8B5CF6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 14px; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .logo-text span { color: #3B82F6; }
        
        .new-btn { background: #3B82F6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 20px; }
        .new-btn:hover { background: #2563EB; }
        
        .section-label { font-size: 11px; text-transform: uppercase; color: #6E7681; font-weight: 600; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .project-item { padding: 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .project-item:hover { background: #1E2D3D; }
        .project-item.active { background: #1E2D3D; border-color: #3B82F6; }
        .project-title { font-weight: 500; font-size: 13px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .project-meta { font-size: 11px; color: #6E7681; }
        .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-top: 6px; }
        
        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        
        /* Welcome */
        .welcome { text-align: center; padding: 100px 40px; }
        .welcome h1 { font-size: 28px; margin-bottom: 10px; }
        .welcome p { color: #6E7681; }
        .welcome-icon { font-size: 60px; margin-bottom: 20px; opacity: 0.3; }
        
        /* Dashboard */
        .dashboard { display: none; }
        .dashboard.active { display: block; }
        
        .page-header { margin-bottom: 30px; }
        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .page-subtitle { color: #6E7681; font-size: 14px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
        .stat-card { background: #161B22; border: 1px solid #1E2D3D; border-radius: 10px; padding: 20px; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: #6E7681; font-weight: 600; margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-value.blue { color: #3B82F6; }
        .stat-value.green { color: #3FB950; }
        .stat-value.orange { color: #F0883E; }
        .stat-value.purple { color: #A855F7; }
        
        /* Pipeline */
        .pipeline-section { background: #161B22; border: 1px solid #1E2D3D; border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .pipeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .pipeline-title { font-size: 16px; font-weight: 600; }
        .pipeline-actions { display: flex; gap: 10px; }
        
        .btn { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 13px; }
        .btn-primary { background: #3B82F6; color: white; }
        .btn-primary:hover { background: #2563EB; }
        .btn-danger { background: transparent; color: #F85149; border: 1px solid #F85149; }
        .btn-danger:hover { background: #F85149; color: white; }
        
        .agents-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .agent-box { background: #0D1117; border: 1px solid #1E2D3D; border-radius: 8px; padding: 16px; text-align: center; transition: all 0.2s; }
        .agent-box.done { border-color: #3FB950; background: rgba(63, 185, 80, 0.1); }
        .agent-box.active { border-color: #3B82F6; background: rgba(59, 130, 246, 0.1); }
        .agent-box.pending { opacity: 0.5; }
        
        .agent-num { width: 32px; height: 32px; border-radius: 50%; background: #1E2D3D; display: flex; align-items: center; justify-content: center; font-weight: 600; margin: 0 auto 10px; font-size: 14px; }
        .agent-box.done .agent-num { background: #3FB950; color: white; }
        .agent-box.active .agent-num { background: #3B82F6; color: white; }
        .agent-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .agent-status { font-size: 10px; color: #6E7681; }
        .agent-box.done .agent-status { color: #3FB950; }
        .agent-box.active .agent-status { color: #3B82F6; }
        
        /* Reports */
        .reports-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .report-card { background: #161B22; border: 1px solid #1E2D3D; border-radius: 10px; padding: 20px; }
        .report-title { font-size: 14px; font-weight: 600; color: #3B82F6; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .report-title-num { width: 24px; height: 24px; background: #3B82F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; }
        .report-content { font-size: 13px; line-height: 1.7; }
        .report-content p { margin: 8px 0; color: #8B949E; }
        .report-content strong { color: #F1F5F9; }
        
        .data-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
        .data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid #1E2D3D; }
        .data-table th { color: #6E7681; font-weight: 500; }
        .data-table td { color: #8B949E; }
        
        .feature-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .feature-tag { background: #1E2D3D; padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #8B949E; }
        
        /* Setup Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: #161B22; border: 1px solid #1E2D3D; border-radius: 12px; padding: 30px; width: 450px; }
        .modal h2 { margin-bottom: 20px; }
        .modal input { width: 100%; padding: 12px; background: #0D1117; border: 1px solid #1E2D3D; border-radius: 6px; color: white; font-size: 14px; margin-bottom: 16px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns .btn { flex: 1; }
        
        .file-drop { border: 2px dashed #1E2D3D; border-radius: 8px; padding: 30px; text-align: center; margin-bottom: 16px; cursor: pointer; transition: all 0.2s; }
        .file-drop:hover { border-color: #3B82F6; }
        .file-drop.has-file { border-color: #3FB950; background: rgba(63, 185, 80, 0.1); }
        .file-drop-icon { font-size: 24px; margin-bottom: 8px; }
        .file-drop-text { color: #6E7681; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">IQ</div>
                <div class="logo-text">Agent<span>IQ</span></div>
            </div>
            <button class="new-btn" onclick="showModal()">+ New Project</button>
            <div class="section-label">Your Projects</div>
            <div id="projectsList"></div>
        </div>
        
        <!-- Main -->
        <div class="main">
            <!-- Welcome -->
            <div id="welcome" class="welcome">
                <div class="welcome-icon">&#128640;</div>
                <h1>Welcome to AgentIQ</h1>
                <p>Select a project or create a new one to get started</p>
            </div>
            
            <!-- Dashboard -->
            <div id="dashboard" class="dashboard">
                <div class="page-header">
                    <h1 class="page-title" id="projectTitle">Project</h1>
                    <p class="page-subtitle" id="projectGoal"></p>
                </div>
                
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Dataset</div><div class="stat-value blue" id="statDataset">-</div></div>
                    <div class="stat-card"><div class="stat-label">Current Agent</div><div class="stat-value purple" id="statAgent">1</div></div>
                    <div class="stat-card"><div class="stat-label">Status</div><div class="stat-value green" id="statStatus">Pending</div></div>
                    <div class="stat-card"><div class="stat-label">Task Type</div><div class="stat-value orange" id="statTask">-</div></div>
                </div>
                
                <!-- Pipeline -->
                <div class="pipeline-section">
                    <div class="pipeline-header">
                        <h2 class="pipeline-title">ML Pipeline</h2>
                        <div class="pipeline-actions">
                            <button class="btn btn-primary" onclick="runPipeline()">&#9654; Run Pipeline</button>
                            <button class="btn btn-danger" onclick="deleteProject()">Delete</button>
                        </div>
                    </div>
                    <div class="agents-row" id="agentsRow"></div>
                </div>
                
                <!-- Reports -->
                <div id="reportsArea" class="reports-grid"></div>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Create New Project</h2>
            <input type="text" id="goalInput" placeholder="Project goal (e.g., predict loan default)">
            <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
                <div class="file-drop-icon">&#128193;</div>
                <div class="file-drop-text" id="fileDropText">Click to upload CSV file</div>
            </div>
            <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleFile(this)">
            <div class="modal-btns">
                <button class="btn btn-primary" onclick="createProject()">Create Project</button>
                <button class="btn" style="background:#1E2D3D;color:#8B949E;" onclick="hideModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        var API = 'http://localhost:8000';
        var currentPid = null;
        var selectedFile = null;
        
        var AGENTS = [
            {id:1, name:'Data Intake & EDA'},
            {id:2, name:'Data Preparation'},
            {id:3, name:'Feature Engineering'},
            {id:4, name:'Model Architecture'},
            {id:5, name:'Training & Tuning'},
            {id:6, name:'Evaluation & Report'}
        ];

        loadProjects();

        function loadProjects() {
            fetch(API + '/projects')
                .then(function(r) { return r.json(); })
                .then(function(list) {
                    var html = '';
                    for (var i = 0; i < list.length; i++) {
                        var p = list[i];
                        var step = p.current_step || '';
                        var status = getStatus(step);
                        var title = (p.project_goal || 'Untitled').substring(0, 25);
                        var active = p.project_id === currentPid ? 'active' : '';
                        html += '<div class="project-item ' + active + '" onclick="selectProject(\'' + p.project_id + '\')">' +
                            '<div class="project-title">' + title + '</div>' +
                            '<div class="project-meta">' + (p.created_at || '').substring(0, 10) + '</div>' +
                            '<div class="status-pill status-' + status + '">' + (step || 'pending') + '</div>' +
                        '</div>';
                    }
                    document.getElementById('projectsList').innerHTML = html;
                });
        }

        function getStatus(step) {
            if (!step) return 'pending';
            if (step === 'complete') return 'done';
            if (step.includes('review') || step.includes('training')) return 'active';
            return 'pending';
        }

        function selectProject(pid) {
            currentPid = pid;
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            loadProjects();
            
            fetch(API + '/projects/' + pid + '/state')
                .then(function(r) { return r.json(); })
                .then(function(s) { renderDashboard(s); });
        }

        function renderDashboard(s) {
            document.getElementById('projectTitle').textContent = s.PROJECT_GOAL || 'Project';
            document.getElementById('projectGoal').textContent = s.PROJECT_GOAL || '';
            
            document.getElementById('statDataset').textContent = s.DATASET_NAME || 'None';
            document.getElementById('statAgent').textContent = getCurrentAgent(s.CURRENT_STEP);
            document.getElementById('statStatus').textContent = s.CURRENT_STEP || 'Pending';
            document.getElementById('statTask').textContent = s.TASK_TYPE || '-';
            
            // Agents
            renderAgents(s.CURRENT_STEP);
            
            // Reports
            renderReports(s);
        }

        function getCurrentAgent(step) {
            if (!step) return '1';
            if (step === 'complete') return '6';
            var map = {
                'eda': 1, 'prep': 2, 'features': 3,
                'model': 4, 'training': 5, 'eval': 6,
                'agent1': 1, 'agent2': 2, 'agent3': 3,
                'agent4': 4, 'agent5': 5, 'agent6': 6
            };
            for (var k in map) { if (step.includes(k)) return map[k]; }
            return '1';
        }

        function getAgentBoxStatus(agentNum, currentAgentNum, step) {
            var isDone = step === 'complete';
            if (isDone) return 'done';
            if (agentNum < currentAgentNum) return 'done';
            if (agentNum === currentAgentNum) {
                if (step && step.includes('_running')) return 'active';
                if (step && step.includes('_error')) return 'error';
                if (step && (step.includes('_review') || step.includes('_running'))) return 'active';
                return 'active';
            }
            return 'pending';
        }

        function getAgentStatusLabel(status, step, agentNum, currentAgentNum) {
            if (status === 'done') return 'Done ✓';
            if (status === 'error') return 'Error ✗';
            if (status === 'active') {
                if (step && step.includes('_running')) return 'Running...';
                return 'Running';
            }
            return 'Pending';
        }

        function renderAgents(step) {
            var current = parseInt(getCurrentAgent(step));
            var html = '';
            for (var i = 0; i < AGENTS.length; i++) {
                var a = AGENTS[i];
                var status = getAgentBoxStatus(i + 1, current, step);
                var label = getAgentStatusLabel(status, step, i + 1, current);
                var borderColor = status === 'done' ? '#3FB950' : status === 'active' ? '#3B82F6' : status === 'error' ? '#F85149' : '';
                var bgColor = status === 'done' ? 'rgba(63,185,80,0.1)' : status === 'active' ? 'rgba(59,130,246,0.1)' : status === 'error' ? 'rgba(248,81,73,0.1)' : '';
                var numBg = status === 'done' ? '#3FB950' : status === 'active' ? '#3B82F6' : status === 'error' ? '#F85149' : '#1E2D3D';
                var style = borderColor ? 'border-color:' + borderColor + ';background:' + bgColor + ';' : 'opacity:0.5;';
                html += '<div class="agent-box" style="' + style + '">' +
                    '<div class="agent-num" style="background:' + numBg + ';color:white;">' + a.id + '</div>' +
                    '<div class="agent-name">' + a.name + '</div>' +
                    '<div class="agent-status" style="color:' + (borderColor || '#6E7681') + ';">' + label + '</div>' +
                '</div>';
            }
            document.getElementById('agentsRow').innerHTML = html;
        }

        function renderReports(s) {
            var html = '';

            // ── Agent 1: EDA ──────────────────────────────────────────────
            if (s.EDA_REPORT) {
                var eda = s.EDA_REPORT;
                var ov = eda.overview || {};
                var cols = eda.column_types || {};
                var missing = Array.isArray(eda.missing_analysis) ? eda.missing_analysis : [];
                var outliers = Array.isArray(eda.outlier_analysis) ? eda.outlier_analysis : [];
                var corr = Array.isArray(eda.correlation_analysis) ? eda.correlation_analysis : [];
                var stats = Array.isArray(eda.statistical_analysis) ? eda.statistical_analysis : [];
                var univariate = Array.isArray(eda.univariate_analysis) ? eda.univariate_analysis : [];
                var catSummary = Array.isArray(eda.categorical_summary) ? eda.categorical_summary : [];
                var llm = eda.llm_analysis || {};
                var dq = eda.data_quality || llm.data_quality || {};
                var findings = eda.key_findings || llm.key_findings || [];
                var recs = eda.recommendations || llm.recommendations || [];

                html += '<div class="report-card" style="grid-column:1/-1;">';
                html += '<div class="report-title"><span class="report-title-num">1</span>Agent 1 — Data Intake & EDA</div>';
                html += '<div class="report-content">';

                // Overview row
                html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">';
                html += _statBox('Rows', (ov.rows||0).toLocaleString(), '#3B82F6');
                html += _statBox('Columns', ov.columns||0, '#8B5CF6');
                html += _statBox('Missing', (ov.total_missing||0).toLocaleString(), '#F0883E');
                html += _statBox('Duplicates', (ov.duplicate_rows||0).toLocaleString(), '#F85149');
                html += '</div>';

                // Column types
                html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">';
                if (cols.numeric && cols.numeric.length) {
                    html += '<div><p style="color:#6E7681;font-size:11px;margin-bottom:6px;">NUMERIC (' + cols.numeric.length + ')</p><div class="feature-list">' + cols.numeric.map(function(x){return '<span class="feature-tag">'+x+'</span>';}).join('') + '</div></div>';
                }
                if (cols.categorical && cols.categorical.length) {
                    html += '<div><p style="color:#6E7681;font-size:11px;margin-bottom:6px;">CATEGORICAL (' + cols.categorical.length + ')</p><div class="feature-list">' + cols.categorical.map(function(x){return '<span class="feature-tag">'+x+'</span>';}).join('') + '</div></div>';
                }
                if (cols.id && cols.id.length) {
                    html += '<div><p style="color:#6E7681;font-size:11px;margin-bottom:6px;">ID COLUMNS</p><div class="feature-list">' + cols.id.map(function(x){return '<span class="feature-tag">'+x+'</span>';}).join('') + '</div></div>';
                }
                html += '</div>';

                // Data quality score
                if (dq.score !== undefined) {
                    var score = parseFloat(dq.score) || 0;
                    var scoreColor = score >= 7 ? '#3FB950' : score >= 4 ? '#F0883E' : '#F85149';
                    html += '<p><strong>Data Quality Score:</strong> <span style="color:' + scoreColor + ';font-size:18px;font-weight:700;">' + score.toFixed(1) + '/10</span></p>';
                }

                // Missing values table
                var missingCols = missing.filter(function(m){return m.missing_pct > 0;});
                if (missingCols.length) {
                    html += '<p style="margin-top:14px;"><strong>Missing Values (' + missingCols.length + ' columns)</strong></p>';
                    html += '<table class="data-table"><tr><th>Column</th><th>Missing</th><th>%</th><th>Status</th></tr>';
                    missingCols.slice(0,10).forEach(function(m) {
                        var color = m.missing_pct > 30 ? '#F85149' : m.missing_pct > 5 ? '#F0883E' : '#8B949E';
                        html += '<tr><td>' + m.column + '</td><td>' + m.missing_count + '</td><td style="color:' + color + ';">' + m.missing_pct.toFixed(1) + '%</td><td>' + (m.status||'') + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Statistical summary
                if (stats.length) {
                    html += '<p style="margin-top:14px;"><strong>Statistical Summary</strong></p>';
                    html += '<table class="data-table"><tr><th>Column</th><th>Mean</th><th>Median</th><th>Std</th><th>Min</th><th>Max</th></tr>';
                    stats.slice(0,8).forEach(function(s) {
                        html += '<tr><td>' + s.column + '</td><td>' + s.mean + '</td><td>' + s.median + '</td><td>' + s.std + '</td><td>' + s.min + '</td><td>' + s.max + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Univariate analysis
                if (univariate.length) {
                    html += '<p style="margin-top:14px;"><strong>Univariate Analysis (Distribution)</strong></p>';
                    html += '<table class="data-table"><tr><th>Column</th><th>Skewness</th><th>Kurtosis</th><th>Distribution</th><th>Suggested Transform</th></tr>';
                    univariate.slice(0,8).forEach(function(u) {
                        html += '<tr><td>' + u.column + '</td><td>' + u.skewness + '</td><td>' + u.kurtosis + '</td><td>' + (u.distribution||'') + '</td><td>' + (u.suggested_transform||'') + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Outlier analysis
                var outlierCols = outliers.filter(function(o){return parseFloat(o.outlier_pct||0) > 0;});
                if (outlierCols.length) {
                    html += '<p style="margin-top:14px;"><strong>Outlier Analysis</strong></p>';
                    html += '<table class="data-table"><tr><th>Column</th><th>Outliers</th><th>%</th><th>Lower Bound</th><th>Upper Bound</th></tr>';
                    outlierCols.slice(0,8).forEach(function(o) {
                        var color = parseFloat(o.outlier_pct||0) > 10 ? '#F85149' : parseFloat(o.outlier_pct||0) > 5 ? '#F0883E' : '#8B949E';
                        html += '<tr><td>' + o.column + '</td><td>' + o.outlier_count + '</td><td style="color:' + color + ';">' + o.outlier_pct + '%</td><td>' + (o.lower_bound||'') + '</td><td>' + (o.upper_bound||'') + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Correlation analysis
                if (corr.length) {
                    html += '<p style="margin-top:14px;"><strong>Strong Correlations (|r| ≥ 0.7)</strong></p>';
                    html += '<table class="data-table"><tr><th>Feature 1</th><th>Feature 2</th><th>Correlation</th><th>Strength</th></tr>';
                    corr.slice(0,8).forEach(function(c) {
                        var val = parseFloat(c.correlation||0);
                        var color = Math.abs(val) >= 0.9 ? '#F85149' : '#F0883E';
                        html += '<tr><td>' + c.feature_1 + '</td><td>' + c.feature_2 + '</td><td style="color:' + color + ';">' + c.correlation + '</td><td>' + (c.strength||'') + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Categorical summary
                if (catSummary.length) {
                    html += '<p style="margin-top:14px;"><strong>Categorical Summary</strong></p>';
                    html += '<table class="data-table"><tr><th>Column</th><th>Unique Values</th><th>Top Value</th><th>Top Freq</th><th>High Cardinality</th></tr>';
                    catSummary.slice(0,8).forEach(function(c) {
                        html += '<tr><td>' + c.column + '</td><td>' + c.unique_values + '</td><td>' + (c.top_value||'') + '</td><td>' + (c.top_freq||0) + '</td><td>' + (c.high_cardinality ? '⚠️ Yes' : 'No') + '</td></tr>';
                    });
                    html += '</table>';
                }

                // Key findings
                if (findings.length) {
                    html += '<p style="margin-top:14px;"><strong>Key Findings</strong></p><ul style="color:#8B949E;padding-left:20px;">';
                    findings.forEach(function(f){ html += '<li style="margin-bottom:4px;">' + f + '</li>'; });
                    html += '</ul>';
                }

                // Recommendations
                if (recs.length) {
                    html += '<p style="margin-top:14px;"><strong>Recommendations</strong></p><ul style="color:#3FB950;padding-left:20px;">';
                    recs.forEach(function(r){ html += '<li style="margin-bottom:4px;">' + r + '</li>'; });
                    html += '</ul>';
                }

                html += '</div></div>';
            }

            // ── Agent 2: Data Prep ────────────────────────────────────────
            if (s.CLEANING_REPORT) {
                var cl = s.CLEANING_REPORT;
                var before = cl.shape_before || [0,0];
                var after = cl.shape_after || [0,0];
                var log = cl.execution_log || [];
                html += '<div class="report-card"><div class="report-title"><span class="report-title-num">2</span>Agent 2 — Data Preparation</div><div class="report-content">';
                html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">';
                html += _statBox('Before', before[0] + ' × ' + before[1], '#8B5CF6');
                html += _statBox('After', after[0] + ' × ' + after[1], '#3FB950');
                html += _statBox('Rows Removed', (before[0]-after[0]), '#F0883E');
                html += '</div>';
                html += '<p><strong>Steps Applied:</strong> ' + (cl.steps_applied||log.length) + '</p>';
                if (log.length) {
                    html += '<table class="data-table"><tr><th>Action</th><th>Column</th><th>Method</th><th>Status</th></tr>';
                    log.slice(0,10).forEach(function(e) {
                        var step = e.step || {};
                        var color = e.status === 'success' ? '#3FB950' : '#F85149';
                        html += '<tr><td>' + (step.action||'') + '</td><td>' + (step.column||'global') + '</td><td>' + (step.method||'') + '</td><td style="color:' + color + ';">' + e.status + '</td></tr>';
                    });
                    html += '</table>';
                }
                html += '</div></div>';
            }

            // ── Agent 3: Feature Engineering ─────────────────────────────
            if (s.FEATURE_ENGINEERING_PLAN || (s.SELECTED_FEATURES && s.SELECTED_FEATURES.length)) {
                var fe = s.FEATURE_ENGINEERING_PLAN || {};
                var feats = s.SELECTED_FEATURES || fe.selected_features || [];
                html += '<div class="report-card"><div class="report-title"><span class="report-title-num">3</span>Agent 3 — Feature Engineering</div><div class="report-content">';
                html += '<p><strong>Target:</strong> ' + (fe.target_column||'-') + ' &nbsp;|&nbsp; <strong>Task:</strong> ' + (fe.task_type||'-') + '</p>';
                html += '<p><strong>Features Selected:</strong> ' + feats.length + '</p>';
                if (fe.encode_columns && fe.encode_columns.length) html += '<p><strong>Encoded:</strong> ' + fe.encode_columns.join(', ') + '</p>';
                if (fe.scale_columns && fe.scale_columns.length) html += '<p><strong>Scaled:</strong> ' + fe.scale_columns.join(', ') + '</p>';
                if (fe.drop_columns && fe.drop_columns.length) html += '<p><strong>Dropped:</strong> ' + fe.drop_columns.join(', ') + '</p>';
                if (feats.length) {
                    html += '<p style="margin-top:10px;"><strong>Selected Features:</strong></p><div class="feature-list">' + feats.slice(0,20).map(function(x){return '<span class="feature-tag">'+x+'</span>';}).join('') + (feats.length>20?'<span class="feature-tag">+' + (feats.length-20) + ' more</span>':'') + '</div>';
                }
                if (fe.notes) html += '<p style="color:#6E7681;margin-top:8px;font-style:italic;">' + fe.notes + '</p>';
                html += '</div></div>';
            }

            // ── Agent 4: Model Architecture ───────────────────────────────
            if (s.CANDIDATE_MODELS) {
                var models = Object.keys(s.CANDIDATE_MODELS);
                html += '<div class="report-card"><div class="report-title"><span class="report-title-num">4</span>Agent 4 — Model Architecture</div><div class="report-content">';
                html += '<p><strong>Candidate Models:</strong> ' + models.length + '</p>';
                html += '<table class="data-table"><tr><th>Model</th><th>Needs Scaling</th><th>Family</th></tr>';
                models.forEach(function(m) {
                    var info = s.CANDIDATE_MODELS[m] || {};
                    html += '<tr><td>' + m + '</td><td>' + (info.needs_scaling ? '✓' : '✗') + '</td><td>' + (info.model_family||'-') + '</td></tr>';
                });
                html += '</table>';
                if (s.SPLIT_STRATEGY) {
                    var sp = s.SPLIT_STRATEGY;
                    html += '<p style="margin-top:10px;"><strong>Split:</strong> ' + ((sp.test_size||0.2)*100) + '% test &nbsp;|&nbsp; <strong>Stratified:</strong> ' + (sp.stratify ? 'Yes ('+sp.stratify+')' : 'No') + '</p>';
                }
                html += '</div></div>';
            }

            // ── Agent 5: Training ─────────────────────────────────────────
            if (s.TRAINING_RESULTS && Object.keys(s.TRAINING_RESULTS).length) {
                var train = s.TRAINING_RESULTS;
                var mnames = Object.keys(train);
                var bestName = mnames.reduce(function(a,b){ return (train[a].cv_mean||0) > (train[b].cv_mean||0) ? a : b; }, mnames[0]);
                html += '<div class="report-card"><div class="report-title"><span class="report-title-num">5</span>Agent 5 — Training & Tuning</div><div class="report-content">';
                html += '<p><strong>Models Trained:</strong> ' + mnames.length + ' &nbsp;|&nbsp; <strong>Best:</strong> <span style="color:#3FB950;">' + bestName + '</span></p>';
                html += '<table class="data-table"><tr><th>Model</th><th>CV Mean</th><th>CV Std</th><th>Scoring</th></tr>';
                mnames.sort(function(a,b){return (train[b].cv_mean||0)-(train[a].cv_mean||0);}).forEach(function(m) {
                    var r = train[m];
                    var color = m === bestName ? '#3FB950' : '#8B949E';
                    html += '<tr><td style="color:' + color + ';">' + m + '</td><td style="color:' + color + ';">' + (r.cv_mean||0).toFixed(4) + '</td><td>' + (r.cv_std||0).toFixed(4) + '</td><td>' + (r.scoring||'-') + '</td></tr>';
                });
                html += '</table>';
                html += '</div></div>';
            }

            // ── Agent 6: Evaluation ───────────────────────────────────────
            if (s.EVALUATION_REPORT) {
                var ev = s.EVALUATION_REPORT;
                html += '<div class="report-card"><div class="report-title"><span class="report-title-num">6</span>Agent 6 — Evaluation & Report</div><div class="report-content">';
                html += '<p><strong>Best Model:</strong> <span style="color:#3FB950;font-size:16px;">' + (ev.best_model||'-') + '</span></p>';
                html += '<p><strong>Task Type:</strong> ' + (ev.task_type||'-') + '</p>';
                if (ev.best_model_metrics) {
                    html += '<table class="data-table"><tr><th>Metric</th><th>Value</th></tr>';
                    Object.keys(ev.best_model_metrics).forEach(function(k) {
                        html += '<tr><td>' + k + '</td><td style="color:#3FB950;">' + ev.best_model_metrics[k] + '</td></tr>';
                    });
                    html += '</table>';
                }
                if (ev.model_comparison) html += '<p style="margin-top:10px;color:#8B949E;">' + ev.model_comparison + '</p>';
                if (ev.feature_importance && Object.keys(ev.feature_importance).length) {
                    html += '<p style="margin-top:10px;"><strong>Feature Importance:</strong></p><div class="feature-list">';
                    Object.keys(ev.feature_importance).slice(0,10).forEach(function(f) {
                        html += '<span class="feature-tag">' + f + ': ' + ev.feature_importance[f] + '</span>';
                    });
                    html += '</div>';
                }
                html += '</div></div>';
            }

            if (!html) {
                html = '<div class="report-card" style="grid-column:1/-1;"><div class="report-content"><p style="color:#6E7681;">No analysis data. Click "Run Pipeline" to generate results.</p></div></div>';
            }

            document.getElementById('reportsArea').innerHTML = html;
        }

        function _statBox(label, value, color) {
            return '<div style="background:#0D1117;border:1px solid #1E2D3D;border-radius:8px;padding:12px;text-align:center;">' +
                '<div style="font-size:10px;color:#6E7681;text-transform:uppercase;margin-bottom:4px;">' + label + '</div>' +
                '<div style="font-size:18px;font-weight:700;color:' + color + ';">' + value + '</div>' +
                '</div>';
        }

        function showModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('goalInput').value = '';
            selectedFile = null;
            document.getElementById('fileDrop').className = 'file-drop';
            document.getElementById('fileDropText').textContent = 'Click to upload CSV file';
        }

        function hideModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById('fileDrop').className = 'file-drop has-file';
                document.getElementById('fileDropText').textContent = selectedFile.name;
            }
        }

        function createProject() {
            var goal = document.getElementById('goalInput').value.trim();
            if (!goal) { alert('Enter project goal'); return; }
            
            fetch(API + '/projects/create', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({project_goal:goal})
            })
            .then(function(r){return r.json()})
            .then(function(d){
                var pid = d.project_id;
                if (selectedFile) {
                    var fd = new FormData();
                    fd.append('file', selectedFile);
                    return fetch(API + '/projects/' + pid + '/upload', {method:'POST', body:fd}).then(function(){return pid;});
                }
                return pid;
            })
            .then(function(pid){
                hideModal();
                selectProject(pid);
                loadProjects();
            });
        }

        function runPipeline() {
            if (!currentPid) return;
            if (!confirm('Run pipeline? This may take several minutes.')) return;
            fetch(API + '/projects/' + currentPid + '/run/full', {method:'POST'})
                .then(function(r) { return r.json(); })
                .then(function() { pollStatus(); });
        }

        var _pollTimer = null;
        function pollStatus() {
            if (_pollTimer) clearTimeout(_pollTimer);
            if (!currentPid) return;
            fetch(API + '/projects/' + currentPid + '/state')
                .then(function(r) { return r.json(); })
                .then(function(s) {
                    renderDashboard(s);
                    loadProjects();
                    var step = s.CURRENT_STEP || '';
                    var status = s.STATUS || s.APPROVAL_STATUS || '';
                    var isRunning = step.includes('_running') || status === 'running';
                    var isDone = step === 'complete' || step.includes('_error');
                    if (!isDone) {
                        _pollTimer = setTimeout(pollStatus, isRunning ? 3000 : 5000);
                    }
                })
                .catch(function() {
                    _pollTimer = setTimeout(pollStatus, 8000);
                });
        }

        function deleteProject() {
            if (!currentPid || !confirm('Delete this project? This cannot be undone.')) return;
            fetch(API + '/projects/' + currentPid, {method: 'DELETE'})
                .then(function(r) { return r.json(); })
                .then(function() {
                    currentPid = null;
                    document.getElementById('dashboard').classList.remove('active');
                    document.getElementById('welcome').style.display = 'block';
                    loadProjects();
                })
                .catch(function(e) { alert('Delete failed: ' + e); });
        }
    </script>
</body>
</html>
